<!doctype html>
<!-- Paints the sleeping-cat artwork procedurally. Open in a browser (or run art/render.js) to export assets/cat.webp. -->
<meta charset="utf-8">
<canvas id="c" width="1200" height="900"></canvas>
<script>
const W = 1200, H = 900;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let seed = 20261115;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
// value noise
const NG = 256, grid = new Float32Array(NG * NG).map(() => rnd());
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const g = (i, j) => grid[((j & 255) * NG) + (i & 255)];
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(g(xi, yi), g(xi + 1, yi), u), lerp(g(xi, yi + 1), g(xi + 1, yi + 1), u), v);
}
const fbm = (x, y) => noise(x, y) * 0.6 + noise(x * 2.1, y * 2.1) * 0.3 + noise(x * 4.3, y * 4.3) * 0.1;

/* ---------------- geometry ---------------- */
const HEAD = { x: 420, y: 585, rx: 150, ry: 132 };
const BODY = { x: 700, y: 585, rx: 285, ry: 150 };
const HAUNCH = { x: 862, y: 548, rx: 178, ry: 168 };
const SHOULDER = { x: 560, y: 572, rx: 160, ry: 140 };
const CHEEK = { x: 420, y: 628, rx: 168, ry: 92 };
const PAWS = [{ x: 352, y: 724, rx: 62, ry: 30 }, { x: 488, y: 730, rx: 60, ry: 29 }];
const TAIL = [[960, 640], [1060, 760], [700, 800], [560, 748]]; // cubic bezier
const tailW = (t) => lerp(76, 44, t);
const bez = (t) => { const [a, b, c, d] = TAIL, m = 1 - t; return [m*m*m*a[0] + 3*m*m*t*b[0] + 3*m*t*t*c[0] + t*t*t*d[0], m*m*m*a[1] + 3*m*m*t*b[1] + 3*m*t*t*c[1] + t*t*t*d[1]]; };
const tailPts = Array.from({ length: 200 }, (_, i) => bez(i / 199));
const EARS = [
  [[HEAD.x - 128, HEAD.y - 52], [HEAD.x - 138, HEAD.y - 178], [HEAD.x - 42, HEAD.y - 122]],
  [[HEAD.x + 38, HEAD.y - 124], [HEAD.x + 126, HEAD.y - 182], [HEAD.x + 132, HEAD.y - 50]],
];
function earPath(e, inset) {
  const [a, tip, b] = e; const p = new Path2D();
  const cx = (a[0] + b[0] + tip[0]) / 3, cy = (a[1] + b[1] + tip[1]) / 3;
  const sh = (q) => [lerp(q[0], cx, inset), lerp(q[1], cy, inset)];
  const A = sh(a), T = sh(tip), B = sh(b);
  p.moveTo(A[0], A[1]); p.quadraticCurveTo(lerp(A[0], T[0], .5) - 8, lerp(A[1], T[1], .5), T[0], T[1]);
  p.quadraticCurveTo(lerp(T[0], B[0], .5) + 6, lerp(T[1], B[1], .5) - 4, B[0], B[1]); p.closePath(); return p;
}
const ell = (e) => { const p = new Path2D(); p.ellipse(e.x, e.y, e.rx, e.ry, 0, 0, Math.PI * 2); return p; };
function tailPath() {
  const p = new Path2D(); const L = [], R = [];
  for (let i = 0; i < tailPts.length; i++) {
    const t = i / (tailPts.length - 1), [x, y] = tailPts[i];
    const [x2, y2] = tailPts[Math.min(i + 1, tailPts.length - 1)], [x0, y0] = tailPts[Math.max(i - 1, 0)];
    let dx = x2 - x0, dy = y2 - y0; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = tailW(t) / 2; L.push([x - dy * w, y + dx * w]); R.push([x + dy * w, y - dx * w]);
  }
  p.moveTo(L[0][0], L[0][1]); L.forEach(q => p.lineTo(q[0], q[1]));
  for (let i = R.length - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]); p.closePath();
  const end = tailPts[tailPts.length - 1], cap = new Path2D(); cap.ellipse(end[0], end[1], tailW(1) / 2, tailW(1) / 2, 0, 0, Math.PI * 2); p.addPath(cap);
  return p;
}
const parts = [
  { id: 1, path: () => { const p = ell(BODY); p.addPath(ell(HAUNCH)); p.addPath(ell(SHOULDER)); return p; } },
  { id: 2, path: tailPath },
  { id: 3, path: () => { const p = ell(PAWS[0]); p.addPath(ell(PAWS[1])); return p; } },
  { id: 4, path: () => { const p = ell(HEAD); p.addPath(ell(CHEEK)); p.addPath(earPath(EARS[0], 0)); p.addPath(earPath(EARS[1], 0)); return p; } },
];

/* part-id map + soft mask */
const idC = document.createElement('canvas'); idC.width = W; idC.height = H; const ic = idC.getContext('2d');
parts.forEach(pt => { ic.fillStyle = `rgb(${pt.id * 60},0,0)`; ic.fill(pt.path()); });
const idData = ic.getImageData(0, 0, W, H).data;
const partAt = (x, y) => { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return 0; return Math.round(idData[(y * W + x) * 4] / 60); };
const mC = document.createElement('canvas'); mC.width = W; mC.height = H; const mc = mC.getContext('2d');
mc.fillStyle = '#fff'; parts.forEach(pt => mc.fill(pt.path()));
const mRaw = mc.getImageData(0, 0, W, H).data;
// separable box blur (3 passes ~ gaussian) of the silhouette, used for edges, rim light and occlusion
const mData = (() => {
  let a = new Float32Array(W * H); for (let i = 0; i < W * H; i++) a[i] = mRaw[i * 4 + 3] / 255;
  const r = 9, tmp = new Float32Array(W * H);
  for (let pass = 0; pass < 3; pass++) {
    for (let y = 0; y < H; y++) { let acc = 0; for (let x = -r; x <= r; x++) acc += a[y * W + clamp(x, 0, W - 1)];
      for (let x = 0; x < W; x++) { tmp[y * W + x] = acc / (2 * r + 1); acc += a[y * W + Math.min(W - 1, x + r + 1)] - a[y * W + Math.max(0, x - r)]; } }
    for (let x = 0; x < W; x++) { let acc = 0; for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, H - 1) * W + x];
      for (let y = 0; y < H; y++) { a[y * W + x] = acc / (2 * r + 1); acc += tmp[Math.min(H - 1, y + r + 1) * W + x] - tmp[Math.max(0, y - r) * W + x]; } }
  }
  return a;
})();
const softAt = (x, y) => { x = clamp(x | 0, 0, W - 1); y = clamp(y | 0, 0, H - 1); return mData[y * W + x]; };

/* ---------------- shading model ---------------- */
const LIGHT = (() => { const v = [0.62, -0.62, 0.48]; const d = Math.hypot(...v); return v.map(c => c / d); })();
const C = {
  dark: [120, 66, 36], mid: [205, 128, 72], light: [236, 182, 128], cream: [248, 226, 198], white: [252, 244, 232],
};
function tailParam(x, y) {
  let best = 1e9, bi = 0; for (let i = 0; i < tailPts.length; i += 2) { const d = (tailPts[i][0] - x) ** 2 + (tailPts[i][1] - y) ** 2; if (d < best) { best = d; bi = i; } }
  return { t: bi / (tailPts.length - 1), d: Math.sqrt(best) };
}
function sphereN(e, x, y) { const u = (x - e.x) / e.rx, v = (y - e.y) / e.ry; const r2 = u * u + v * v; return [u, v, Math.sqrt(Math.max(0.02, 1 - r2)), r2]; }
function surface(x, y) {
  const pid = partAt(x, y); if (!pid) return null;
  let n, col, fur = [0, 0], glow = 0;
  const nz = fbm(x / 60, y / 60);
  if (pid === 4) {
    const h1 = sphereN(HEAD, x, y), h2 = sphereN(CHEEK, x, y);
    const [u, v, z] = (h1[3] < 1 && (h2[3] >= 1 || h1[2] >= h2[2])) || (h1[3] >= 1 && h2[3] >= 1) ? h1 : [h2[0] * 0.9, h2[1] + 0.15, h2[2]];
    n = [u, v, z];
    col = mix(C.mid, C.light, 0.35 + 0.3 * nz);
    // forehead M stripes & cheek stripes
    if (v < -0.25 && Math.abs(u) < 0.6) col = mix(col, C.dark, smooth(0.45, 0.9, Math.sin(u * 18 + nz * 3) * 0.5 + 0.5) * smooth(-0.25, -0.6, v) * 0.75);
    if (Math.abs(u) > 0.55 && v > -0.2 && v < 0.5) col = mix(col, C.dark, smooth(0.6, 0.95, Math.sin(v * 16 + nz * 2) * 0.5 + 0.5) * 0.45);
    // muzzle, chin
    const mu = (x - HEAD.x) / 75, mv = (y - (HEAD.y + 68)) / 48; const md = mu * mu + mv * mv;
    col = mix(col, C.cream, smooth(1.5, 0.35, md));
    const chin = smooth(1.0, 0.2, ((x - HEAD.x) / 62) ** 2 + ((y - (HEAD.y + 108)) / 32) ** 2);
    col = mix(col, C.white, chin);
    glow = Math.max(smooth(1.3, 0.3, md), chin) * 0.55;
    // ears: flatter normal, darker edges
    if (Math.hypot(u, v) > 1) { n = [u * 0.4, -0.5, 0.75]; col = mix(C.mid, C.dark, 0.25); }
    fur = [x - HEAD.x, y - (HEAD.y + 55)];
  } else if (pid === 1) {
    const cands = [sphereN(BODY, x, y), sphereN(HAUNCH, x, y), sphereN(SHOULDER, x, y)].filter(c => c[3] < 1);
    const s = cands.sort((p, q) => q[2] - p[2])[0] || sphereN(BODY, x, y); n = [s[0], s[1] * 1.1, s[2]];
    const v = (y - BODY.y) / BODY.ry;
    col = mix(C.mid, C.light, 0.25 + 0.35 * nz);
    // tabby bands wrap over the back, bending with the curve of the body
    const band = Math.sin((x - 520) / 15 + (y - 470) * (x > 760 ? -0.05 : 0.03) + nz * 3.2);
    const stripe = smooth(0.5, 0.97, band) * smooth(0.3, 0.8, noise(x / 70, y / 30) + 0.25);
    col = mix(col, C.dark, stripe * smooth(0.45, -0.5, v) * 0.75);
    col = mix(col, C.cream, smooth(0.35, 0.95, v) * 0.8);
    // fur flows from shoulders toward the rear, around the curve of the back
    fur = [-(y - BODY.y) / BODY.ry * 0.6 + 1, (x - BODY.x) / BODY.rx * 0.6 + 0.35];
  } else if (pid === 2) {
    const tp = tailParam(x, y), w = tailW(tp.t) / 2;
    const i = Math.round(tp.t * (tailPts.length - 1)); const p0 = tailPts[Math.max(0, i - 1)], p1 = tailPts[Math.min(tailPts.length - 1, i + 1)];
    let dx = p1[0] - p0[0], dy = p1[1] - p0[1]; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const side = Math.sign((x - tailPts[i][0]) * -dy + (y - tailPts[i][1]) * dx) || 1;
    const r = clamp(tp.d / w); n = [-dy * side * r, dx * side * r, Math.sqrt(1 - r * r) + 0.05];
    col = mix(C.mid, C.light, 0.3 + 0.3 * nz);
    col = mix(col, C.dark, smooth(0.55, 0.95, Math.sin(tp.t * Math.PI * 16) * 0.5 + 0.5) * 0.7);
    if (tp.t > 0.93) col = mix(col, C.dark, 0.6);
    fur = [dx * 1.5 - dy * 0.2, dy * 1.5 + dx * 0.2];
  } else {
    const e = PAWS[x < 440 ? 0 : 1]; const [u, v, z] = sphereN(e, x, y); n = [u, v, z];
    col = mix(C.cream, C.white, 0.5 + 0.3 * nz); fur = [1, 0.2];
  }
  const nl = Math.hypot(...n); n = n.map(c => c / nl);
  const diff = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
  const soft = softAt(x, y);
  const ao = 0.74 + 0.26 * smooth(0.3, 0.92, soft);
  const bright = lerp((0.38 + 0.78 * diff) * ao, 0.95, glow);
  const rim = smooth(0.62, 0.35, soft) * smooth(0.2, 0.7, n[0] * 0.7 - n[1] * 0.7);
  let c = col.map(v => v * bright);
  c = mix(c, [255, 236, 210], rim * 0.5);
  // cool moonlit ambient in shadows
  c = mix(c, [70, 74, 120], (1 - diff) * 0.14 * (1 - glow));
  return { c, fur, pid, soft };
}

/* ---------------- background ---------------- */
function background() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1A1F3D'); g.addColorStop(0.55, '#2E2848'); g.addColorStop(1, '#3B2E45');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // moonlight through a window
  const mg = ctx.createRadialGradient(990, 170, 10, 990, 170, 520);
  mg.addColorStop(0, 'rgba(255,240,214,0.55)'); mg.addColorStop(0.18, 'rgba(232,214,255,0.22)'); mg.addColorStop(1, 'rgba(60,60,110,0)');
  ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.filter = 'blur(2px)';
  ctx.fillStyle = 'rgba(255,246,226,0.95)'; ctx.beginPath(); ctx.arc(990, 170, 58, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // moon craters
  ctx.save(); ctx.globalAlpha = 0.12; ctx.fillStyle = '#B9A88A';
  [[970, 150, 14], [1012, 190, 10], [998, 140, 6], [962, 192, 8]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });
  ctx.restore();
  // bokeh
  ctx.save(); ctx.filter = 'blur(6px)';
  for (let i = 0; i < 26; i++) {
    const x = rnd() * W, y = rnd() * 420, r = 6 + rnd() * 22;
    ctx.fillStyle = `rgba(${200 + rnd() * 55 | 0},${190 + rnd() * 50 | 0},255,${0.05 + rnd() * 0.12})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.restore();
  // tiny stars
  for (let i = 0; i < 90; i++) { ctx.fillStyle = `rgba(255,250,240,${0.2 + rnd() * 0.5})`; ctx.fillRect(rnd() * W, rnd() * 380, 1.4, 1.4); }
}

/* knitted blanket */
function blanket() {
  const top = (x) => 668 + Math.sin(x / 210) * 16 + Math.sin(x / 71) * 5;
  const fold = (x, y) => Math.sin(x / 150 + y / 240) * 0.5 + 0.5;
  ctx.save();
  const p = new Path2D(); p.moveTo(0, H); for (let x = 0; x <= W; x += 10) p.lineTo(x, top(x)); p.lineTo(W, H); p.closePath();
  ctx.clip(p);
  ctx.fillStyle = '#7A6558'; ctx.fillRect(0, 600, W, 300);
  const sw = 30, sh = 24;
  for (let row = -1; row * sh < 300; row++) {
    for (let col = -1; col * sw < W + sw; col++) {
      const group = Math.floor((col + 100) / 4) % 3; // cable, rib, cable...
      const twist = group === 1 ? 0 : Math.sin(row * 0.8 + col) * 4;
      const x = col * sw + twist, y = 640 + row * sh + Math.sin(col * 0.7) * 2;
      const f = fold(x, y), depth = (y - 660) / 240;
      const lit = clamp(0.82 + 0.28 * f - depth * 0.35, 0.35, 1.1);
      const base = [246 * lit, 228 * lit, 200 * lit];
      for (const s of [-1, 1]) {
        ctx.save(); ctx.translate(x + sw / 2 + s * 7, y + sh / 2); ctx.rotate(s * 0.55);
        const g = ctx.createLinearGradient(-8, -12, 8, 12);
        g.addColorStop(0, `rgb(${base.map(v => Math.min(255, v * 1.15) | 0)})`); g.addColorStop(0.55, `rgb(${base.map(v => v | 0)})`); g.addColorStop(1, `rgb(${base.map(v => v * 0.6 | 0)})`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 8, 14, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = `rgba(255,248,236,${0.18 * lit})`; ctx.lineWidth = 0.8;
        for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * 2.5, -11); ctx.lineTo(k * 2.5 + 1, 11); ctx.stroke(); }
        ctx.restore();
      }
    }
  }
  const sg = ctx.createLinearGradient(0, 660, 0, H); sg.addColorStop(0, 'rgba(30,22,48,0)'); sg.addColorStop(1, 'rgba(30,22,48,0.45)');
  ctx.fillStyle = sg; ctx.fillRect(0, 600, W, 300);
  const lg = ctx.createRadialGradient(900, 520, 60, 900, 520, 720); lg.addColorStop(0, 'rgba(255,232,200,0.16)'); lg.addColorStop(1, 'rgba(20,10,30,0.3)');
  ctx.fillStyle = lg; ctx.fillRect(0, 600, W, 300);
  ctx.restore();
  ctx.save(); ctx.filter = 'blur(1.5px)'; ctx.strokeStyle = 'rgba(255,240,220,0.35)'; ctx.lineWidth = 4; ctx.beginPath();
  for (let x = 0; x <= W; x += 10) x ? ctx.lineTo(x, top(x)) : ctx.moveTo(x, top(x)); ctx.stroke(); ctx.restore();
}

/* ---------------- cat ---------------- */
function catBase() {
  // contact shadow
  ctx.save(); ctx.filter = 'blur(26px)'; ctx.fillStyle = 'rgba(20,12,30,0.55)';
  ctx.beginPath(); ctx.ellipse(690, 760, 470, 70, 0, 0, 7); ctx.fill(); ctx.restore();
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let y = 300; y < 860; y++) for (let x = 180; x < 1160; x++) {
    const s = surface(x, y); if (!s) continue;
    const i = (y * W + x) * 4, a = idData[i] ? 1 : 0;
    d[i] = s.c[0]; d[i + 1] = s.c[1]; d[i + 2] = s.c[2]; d[i + 3] = 255 * a;
  }
  ctx.putImageData(img, 0, 0);
}
function strokeFur(x, y, s, len, width, alpha, out, tint) {
  let [fx, fy] = s.fur; const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
  if (out) { fx = out[0]; fy = out[1]; }
  const ang = Math.atan2(fy, fx) + (rnd() - 0.5) * 0.5;
  const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  const bend = (rnd() - 0.5) * len * 0.35;
  const jitter = 0.82 + rnd() * 0.36;
  const c = (tint ? mix(s.c, tint, 0.4) : s.c).map(v => clamp(v * jitter, 0, 255) | 0);
  ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo((x + ex) / 2 - Math.sin(ang) * bend, (y + ey) / 2 + Math.cos(ang) * bend, ex, ey); ctx.stroke();
}
function fur() {
  ctx.lineCap = 'round';
  ctx.save();
  const clip = new Path2D(); parts.forEach(pt => clip.addPath(pt.path())); ctx.clip(clip);
  for (let k = 0; k < 140000; k++) {
    const x = 180 + rnd() * 980, y = 300 + rnd() * 560; const s = surface(x, y); if (!s) continue;
    const l = s.pid === 4 ? 5 + rnd() * 7 : 8 + rnd() * 12;
    strokeFur(x, y, s, l, 0.9 + rnd() * 1.1, 0.35 + rnd() * 0.3);
  }
  ctx.restore();
  // fluffy outline: strands escaping the silhouette
  for (let k = 0; k < 220000; k++) {
    const x = 180 + rnd() * 980, y = 300 + rnd() * 560; const soft = softAt(x, y);
    if (soft < 0.38 || soft > 0.66) continue; const s = surface(x, y); if (!s) continue;
    const gx = softAt(x + 3, y) - softAt(x - 3, y), gy = softAt(x, y + 3) - softAt(x, y - 3); const gl = Math.hypot(gx, gy) || 1;
    const [fx, fy] = s.fur; const fl = Math.hypot(fx, fy) || 1;
    const ox = -gx / gl * 0.75 + fx / fl * 0.25, oy = -gy / gl * 0.75 + fy / fl * 0.25;
    const lit = clamp(0.5 + ox * 0.5 - oy * 0.5); // edges facing the moon catch its light
    strokeFur(x, y, s, 6 + rnd() * 13, 0.6 + rnd() * 0.8, 0.38, [ox, oy], mix([226, 160, 104], [255, 236, 208], lit));
  }
}
function face() {
  const hx = HEAD.x, hy = HEAD.y;
  // inner ears
  EARS.forEach((e, idx) => {
    ctx.save(); const p = earPath(e, 0.32); ctx.clip(p);
    const tip = e[1]; const g = ctx.createLinearGradient(tip[0], tip[1], (e[0][0] + e[2][0]) / 2, (e[0][1] + e[2][1]) / 2);
    g.addColorStop(0, 'rgb(150,86,92)'); g.addColorStop(1, 'rgb(214,150,150)');
    ctx.fillStyle = g; ctx.fill(p);
    ctx.lineCap = 'round';
    for (let k = 0; k < 160; k++) { // ear tufts
      const bx = lerp(e[0][0], e[2][0], rnd()), by = lerp(e[0][1], e[2][1], rnd());
      ctx.strokeStyle = `rgba(250,236,214,${0.25 + rnd() * 0.4})`; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(lerp(bx, tip[0], 0.25 + rnd() * 0.35) + (rnd() - .5) * 10, lerp(by, tip[1], 0.25 + rnd() * 0.35)); ctx.stroke();
    }
    ctx.restore();
  });
  // closed eyes
  [[-1], [1]].forEach(([s]) => {
    const x0 = hx + s * 26, x1 = hx + s * 88, y = hy + 8;
    ctx.save(); ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,240,220,0.35)'; ctx.lineWidth = 6;
