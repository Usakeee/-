<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달빛 자장가</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--PWA-->
<meta name="theme-color" content="#0B1022">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!--/PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one quiet screen — the moon is the start button; settings sit below it. Night view is a near-black breathing orb. */
:root {
  --night: #0B1022;
  --deep: #05070F;
  --surface: #151B36;
  --ink: #E6E8F4;
  --mist: #9DA4C7;
  --moon: #F1DFAE;
  --moon-warm: #D8B46E;
  --line: rgba(157, 164, 199, 0.2);
  --font-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--moon); outline-offset: 3px; }

.view {
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 28px;
}

/* ---------- Home ---------- */
#home {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  background: radial-gradient(120% 70% at 50% 18%, var(--surface) 0%, var(--night) 62%);
}
.brand { text-align: center; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.18em; color: var(--mist); }
h1 {
  margin: 4px 0 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 7vw, 36px);
  letter-spacing: 0.02em;
  text-wrap: balance;
}
.moon {
  position: relative;
  width: min(52vw, 210px);
  aspect-ratio: 1;
  max-width: 100%;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  background: radial-gradient(circle at 38% 34%, #FFF6DA 0%, var(--moon) 42%, var(--moon-warm) 100%);
  box-shadow: 0 0 40px 6px rgba(241, 223, 174, 0.22), 0 0 120px 30px rgba(241, 223, 174, 0.08);
  animation: glow 6s ease-in-out infinite;
  transition: transform .3s ease;
}
.moon::before, .moon::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: rgba(176, 140, 70, 0.22);
}
.moon::before { width: 18%; height: 18%; left: 24%; top: 52%; }
.moon::after { width: 11%; height: 11%; left: 60%; top: 30%; }
.moon:active { transform: scale(.96); }
.moon.loading { animation: none; opacity: .7; }
@keyframes glow {
  0%, 100% { box-shadow: 0 0 40px 6px rgba(241,223,174,.22), 0 0 120px 30px rgba(241,223,174,.08); }
  50% { box-shadow: 0 0 56px 12px rgba(241,223,174,.32), 0 0 160px 44px rgba(241,223,174,.12); }
}
.hint { margin: -4px 0 0; color: var(--mist); font-size: 14px; text-align: center; min-height: 1.6em; }

.settings {
  width: 100%;
  max-width: 440px;
  display: grid;
  gap: 18px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(21, 27, 54, 0.55);
}
.group { display: grid; gap: 8px; min-width: 0; }
.label { font-size: 12px; letter-spacing: 0.12em; color: var(--mist); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 14px;
  color: var(--mist);
  cursor: pointer;
  transition: background .2s, color .2s, border-color .2s;
}
.chip[aria-pressed="true"] { background: var(--moon); border-color: var(--moon); color: var(--night); }
.slider { display: grid; grid-template-columns: 6.5em 1fr; align-items: center; gap: 12px; font-size: 14px; color: var(--mist); }
input[type="range"] { width: 100%; accent-color: var(--moon); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--mist); cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--moon); }

/* ---------- Night ---------- */
#night {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding-top: max(32px, env(safe-area-inset-top, 0px));
  padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  transition: opacity 3s ease;
}
#night.dim .fade-on-dim { opacity: .18; }
.fade-on-dim { transition: opacity 3s ease; }
.stars { position: absolute; inset: 0; pointer-events: none; }
.star {
  position: absolute;
  width: 2px; height: 2px;
  border-radius: 50%;
  background: var(--ink);
  opacity: .15;
  animation: twinkle 7s ease-in-out infinite;
}
@keyframes twinkle { 50% { opacity: .55; } }
.orb-wrap { width: min(56vw, 230px); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; }
.orb {
  width: 70%; aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 36%, rgba(255,246,218,.55), rgba(241,223,174,.22) 55%, rgba(216,180,110,.06) 100%);
  box-shadow: 0 0 80px 20px rgba(241,223,174,.08);
  transition-property: transform;
  transition-timing-function: ease-in-out;
  transform: scale(1);
}
.breath-text { margin: 0; font-family: var(--font-display); font-size: 22px; letter-spacing: .04em; color: var(--ink); opacity: .85; }
.count { font-variant-numeric: tabular-nums; color: var(--mist); font-size: 15px; margin-left: 6px; }
.whisper { margin: 0; max-width: 22em; text-align: center; color: var(--mist); font-size: 15px; transition: opacity 1.5s ease; text-wrap: balance; }
.night-foot {
  position: absolute;
  left: 0; right: 0;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; align-items: center; gap: 16px;
  font-size: 13px; color: var(--mist);
  font-variant-numeric: tabular-nums;
}
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 16px; color: var(--mist); cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  .moon, .star { animation: none; }
  .orb { transition-duration: 0s !important; }
}
</style>
</head>
<body>

<main id="home" class="view">
  <header class="brand">
    <p class="eyebrow">오늘 하루도 수고했어요</p>
    <h1>달빛 자장가</h1>
  </header>

  <button id="moon" class="moon" type="button" aria-label="잠들기 시작"></button>
  <p class="hint" id="hint">달을 누르면 자장가가 시작돼요</p>

  <section class="settings" aria-label="설정">
    <div class="group">
      <span class="label" id="lbl-music">자장가</span>
      <div class="chips" data-group="music" role="group" aria-labelledby="lbl-music">
        <button class="chip" type="button" data-value="brahms">브람스 자장가</button>
        <button class="chip" type="button" data-value="twinkle">작은 별</button>
        <button class="chip" type="button" data-value="calm">잔잔한 화음</button>
        <button class="chip" type="button" data-value="none">음악 없이</button>
      </div>
    </div>
    <div class="group">
      <span class="label" id="lbl-amb">배경 소리</span>
      <div class="chips" data-group="amb" role="group" aria-labelledby="lbl-amb">
        <button class="chip" type="button" data-value="rain">빗소리</button>
        <button class="chip" type="button" data-value="ocean">파도</button>
        <button class="chip" type="button" data-value="brown">포근한 소음</button>
        <button class="chip" type="button" data-value="none">없음</button>
      </div>
    </div>
    <div class="group">
      <span class="label" id="lbl-timer">잠들기 타이머</span>
      <div class="chips" data-group="timer" role="group" aria-labelledby="lbl-timer">
        <button class="chip" type="button" data-value="15">15분</button>
        <button class="chip" type="button" data-value="30">30분</button>
        <button class="chip" type="button" data-value="60">1시간</button>
        <button class="chip" type="button" data-value="0">끄지 않기</button>
      </div>
    </div>
    <label class="slider" for="musicVol">음악 크기 <input type="range" id="musicVol" min="0" max="1" step="0.05"></label>
    <label class="slider" for="ambVol">배경 소리 크기 <input type="range" id="ambVol" min="0" max="1" step="0.05"></label>
    <label class="toggle" for="autostart"><input type="checkbox" id="autostart"> 앱을 열면 바로 재생하기</label>
  </section>
</main>

<section id="night" class="view" hidden aria-live="polite">
  <div class="stars" id="stars"></div>
  <div class="orb-wrap fade-on-dim"><div class="orb" id="orb"></div></div>
  <p class="breath-text fade-on-dim"><span id="breathText">편하게 누워요</span><span class="count" id="breathCount"></span></p>
  <p class="whisper fade-on-dim" id="whisper">휴대폰을 내려놓고 눈을 감아요</p>
  <div class="night-foot">
    <span id="remain"></span>
    <button class="ghost" id="stop" type="button">멈추기</button>
  </div>
</section>

<audio id="musicEl" loop preload="auto" playsinline></audio>
<audio id="ambEl" loop preload="auto" playsinline></audio>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);

  /* ---------- settings (per-device convenience only) ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('lullaby.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('lullaby.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const state = {
    music: store.get('music', 'brahms'),
    amb: store.get('amb', 'rain'),
    timer: store.get('timer', 30),
    musicVol: store.get('musicVol', 0.7),
    ambVol: store.get('ambVol', 0.45),
    autostart: store.get('autostart', true),
    playing: false,
  };

  /* ---------- music theory helpers ---------- */
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const nm = (s) => { const m = /^([A-G])(#|b)?(\d)$/.exec(s); return 12 * (+m[3] + 1) + STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); };
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function seq(str, shift, startBeat = 0) {
    let t = startBeat; const notes = [];
    for (const tok of str.split(/\s+/)) {
      if (!tok || tok === '|') continue;
      const [n, d] = tok.split(':'); const dur = d ? parseFloat(d) : 1;
      if (n !== 'r') notes.push([nm(n) + shift, t, dur]);
      t += dur;
    }
    return { notes, end: t };
  }
  const CH = {
    C: ['C3', 'G3', 'E4', 'G4'], Am: ['A2', 'E3', 'C4', 'E4'], G: ['G2', 'D3', 'B3', 'D4'],
    G7: ['G2', 'D3', 'B3', 'F4'], F: ['F2', 'C3', 'A3', 'C4'],
    Cmaj7: ['C3', 'G3', 'B3', 'E4'], Am7: ['A2', 'E3', 'G3', 'C4'], Fmaj7: ['F2', 'C3', 'E3', 'A3'],
    G6: ['G2', 'D3', 'E3', 'B3'], Em7: ['E2', 'B2', 'G3', 'D4'],
  };
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  /* ---------- tracks (public-domain melodies + one generated) ---------- */
  const TRACKS = {
    brahms: (() => {
      const mel = seq(`E4:.5 E4:.5 | G4:2 E4:.5 E4:.5 | G4:2 E4:.5 G4:.5 | C5:1 B4:1.5 A4:.5 | A4:1 G4:1 D4:.5 E4:.5 |
        F4:1 D4:1 D4:.5 E4:.5 | F4:2 D4:.5 F4:.5 | B4:.5 A4:.5 G4:1 B4:1 | C5:2 C4:.5 C4:.5 | C5:2 A4:.5 F4:.5 |
        G4:2 E4:.5 C4:.5 | F4:1 G4:1 A4:1 | G4:2 C4:.5 C4:.5 | C5:2 A4:.5 F4:.5 | G4:2 E4:.5 C4:.5 | F4:1 E4:1 D4:1 | C4:3`, 12);
      const prog = ['C', 'C', 'Am', 'G', 'G7', 'G7', 'G7', 'C', 'F', 'C', 'G7', 'C', 'F', 'C', 'G7', 'C'];
      return { title: '브람스 자장가', bpm: 64, beats: mel.end + 2, notes: mel.notes, chords: prog.map((c, i) => [1 + 3 * i, 3, c]) };
    })(),
    twinkle: (() => {
      const a = 'C4 C4 G4 G4 A4 A4 G4:2 | F4 F4 E4 E4 D4 D4 C4:2 |';
      const b = 'G4 G4 F4 F4 E4 E4 D4:2 |';
      const mel = seq([a, b, b, a, 'r:4'].join(' '), 12);
      const prog = 'C C F C F C G C C F C G C F C G C C F C F C G C C C'.split(' ');
      return { title: '작은 별', bpm: 70, beats: mel.end, notes: mel.notes, chords: prog.map((c, i) => [2 * i, 2, c]) };
    })(),
    calm: (() => {
      const prog = ['Cmaj7', 'Am7', 'Fmaj7', 'G6', 'Cmaj7', 'Em7', 'Fmaj7', 'G6'];
      const rnd = mulberry(7); const notes = [];
      prog.forEach((c, i) => {
        const tones = CH[c].slice(1).map(nm);
        [0, 1.5, 2.5].forEach((b) => { if (rnd() < 0.7) notes.push([tones[Math.floor(rnd() * tones.length)] + (rnd() < 0.5 ? 12 : 24), 4 * i + b, 2]); });
      });
      return { title: '잔잔한 화음', bpm: 42, beats: 32, notes, chords: prog.map((c, i) => [4 * i, 4, c]) };
    })(),
  };
  const AMB_TITLES = { rain: '빗소리', ocean: '파도', brown: '포근한 소음' };

  /* ---------- rendering ---------- */
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  function renderCtx(ctx) {
    return new Promise((res, rej) => {
      ctx.oncomplete = (e) => res(e.renderedBuffer);
      const p = ctx.startRendering();
      if (p && p.then) p.then(res, rej);
    });
  }
  function impulse(ctx, sec) {
    const n = Math.floor(sec * ctx.sampleRate); const b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2); }
    return b;
  }
  function bell(ctx, dest, midi, t, vel) {
    const f = hz(midi); const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.005);
    g.gain.exponentialRampToValueAtTime(vel * 0.35, t + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);
    g.connect(dest);
    [[1, 1, 3.4], [2, 0.22, 0.7], [3.01, 0.07, 0.35], [4.17, 0.03, 0.2]].forEach(([mult, amp, dec]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * mult;
      const og = ctx.createGain(); og.gain.setValueAtTime(amp, t); og.gain.exponentialRampToValueAtTime(amp * 0.005, t + dec);
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 3.5);
    });
  }
  function pad(ctx, dest, names, t, dur) {
    const att = 1.6, rel = 2.6; const g = ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + att);
    g.gain.setValueAtTime(1, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + rel);
    g.connect(dest);
    names.forEach((n, i) => {
      const f = hz(nm(n));
      const voices = i === 0 ? [['sine', 0, 0.09]] : [['triangle', -6, 0.02], ['triangle', 6, 0.02]];
      voices.forEach(([type, det, amp]) => {
        const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
        const og = ctx.createGain(); og.gain.value = amp; o.connect(og); og.connect(g);
        o.start(t); o.stop(t + dur + rel + 0.1);
      });
    });
  }
  async function renderMusic(track) {
    const SR = 44100, spb = 60 / track.bpm, L = track.beats * spb, tail = 8;
    const Ls = Math.round(L * SR);
    const ctx = new OAC(2, Ls + Math.round(tail * SR), SR);
    const master = ctx.createGain(); master.connect(ctx.destination);
    const verb = ctx.createConvolver(); verb.buffer = impulse(ctx, 4.5);
    const wet = ctx.createGain(); wet.gain.value = 0.5; verb.connect(wet); wet.connect(master);
    const dry = ctx.createGain(); dry.gain.value = 0.75; dry.connect(master);
    const bellBus = ctx.createBiquadFilter(); bellBus.type = 'lowpass'; bellBus.frequency.value = 3800;
    bellBus.connect(dry); bellBus.connect(verb);
    const padBus = ctx.createBiquadFilter(); padBus.type = 'lowpass'; padBus.frequency.value = 1100;
    padBus.connect(dry); padBus.connect(verb);
    track.notes.forEach(([m, b]) => bell(ctx, bellBus, m, b * spb + 0.05, 0.2));
    track.chords.forEach(([b, d, c]) => pad(ctx, padBus, CH[c], b * spb + 0.05, d * spb));
    const buf = await renderCtx(ctx);
    const chs = [buf.getChannelData(0), buf.getChannelData(1)].map((d) => {
      const out = d.slice(0, Ls);
      for (let i = Ls; i < d.length && i - Ls < Ls; i++) out[i - Ls] += d[i]; // fold the tail onto the start: seamless loop
      return out;
    });
    normalizePeak(chs, 0.8);
    return wav(chs, SR);
  }
  function renderAmb(kind) {
    const SR = 44100, L = 24, X = SR; const n = L * SR;
    const rnd = mulberry(kind.length * 97 + 3);
    const a = new Float32Array(n + X);
    let lp = 0, lp2 = 0, br = 0, drop = 0, dropDecay = 0;
    for (let i = 0; i < a.length; i++) {
      const w = rnd() * 2 - 1;
      br = (br + 0.02 * w) / 1.02;
      if (kind === 'rain') {
        lp += 0.4 * (w - lp); lp2 += 0.03 * (w - lp2);
        if (rnd() < 40 / SR) { drop = 0.15 + rnd() * 0.5; dropDecay = Math.exp(-1 / (SR * (0.002 + rnd() * 0.01))); }
        drop *= dropDecay;
        a[i] = (lp - lp2) * 0.55 + br * 1.6 + drop * (rnd() * 2 - 1);
      } else if (kind === 'ocean') {
        const t = (i % n) / SR;
        const e = Math.pow(Math.sin(Math.PI * t / 8), 2);
        const env = 0.12 + 0.88 * e;
        lp += 0.08 * (w - lp);
        a[i] = br * 3.4 * env + lp * 0.9 * e * e;
      } else {
        a[i] = br * 3.2;
      }
    }
    const out = a.slice(0, n);
    for (let i = 0; i < X; i++) { const k = i / X; out[i] = a[i] * Math.sqrt(k) + a[n + i] * Math.sqrt(1 - k); }
    let rms = 0; for (let i = 0; i < n; i += 4) rms += out[i] * out[i]; rms = Math.sqrt(rms / (n / 4));
    const g = 0.13 / (rms || 1); for (let i = 0; i < n; i++) out[i] = Math.max(-0.95, Math.min(0.95, out[i] * g));
    return Promise.resolve(wav([out], SR));
  }
  function normalizePeak(chs, target) {
    let p = 0; chs.forEach((d) => { for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > p) p = v; } });
    const g = target / (p || 1); chs.forEach((d) => { for (let i = 0; i < d.length; i++) d[i] *= g; });
  }
  function wav(chs, sr) {
    const n = chs[0].length, nc = chs.length, size = n * nc * 2;
    const buf = new ArrayBuffer(44 + size); const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + size, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, nc, true); v.setUint32(24, sr, true);
    v.setUint32(28, sr * nc * 2, true); v.setUint16(32, nc * 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, size, true);
    let o = 44;
    for (let i = 0; i < n; i++) for (let c = 0; c < nc; c++) { const s = Math.max(-1, Math.min(1, chs[c][i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2; }
    return new Blob([buf], { type: 'audio/wav' });
  }
  const SILENT = URL.createObjectURL(wav([new Float32Array(4410)], 44100));

  const cache = {};
  function getUrl(kind, key) {
    if (key === 'none') return Promise.resolve(null);
    const id = kind + ':' + key;
    if (!cache[id]) cache[id] = (kind === 'music' ? renderMusic(TRACKS[key]) : renderAmb(key)).then((b) => URL.createObjectURL(b));
    return cache[id];
  }
  const prepare = () => Promise.all([getUrl('music', state.music), getUrl('amb', state.amb)]);

  /* ---------- playback ---------- */
  const musicEl = $('#musicEl'), ambEl = $('#ambEl');
  let startAt = 0, endAt = 0, tickId = 0, breathId = 0, whisperId = 0, dimId = 0;
  const FADE_IN = 8000, FADE_OUT = 180000;

  async function setAndPlay(el, url) {
    if (!url) { el.pause(); el.removeAttribute('src'); return; }
    if (el.src !== url) el.src = url;
    el.currentTime = 0;
    await el.play();
  }
  function applyVolumes() {
    const now = Date.now();
    const fin = Math.min(1, (now - startAt) / FADE_IN);
    const fout = endAt ? Math.max(0, Math.min(1, (endAt - now) / Math.min(FADE_OUT, (endAt - startAt) / 3))) : 1;
    const k = fin * fout;
    try { musicEl.volume = Math.max(0, Math.min(1, state.musicVol * k)); ambEl.volume = Math.max(0, Math.min(1, state.ambVol * k)); } catch (e) {}
    return now;
  }
  function tick() {
    const now = applyVolumes();
    if (endAt) {
      const left = Math.max(0, endAt - now);
      const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
      $('#remain').textContent = `${m}:${String(s).padStart(2, '0')} 뒤에 꺼져요`;
      if (left <= 0) { stop('푹 자요. 내일 또 만나요.'); }
    } else {
      $('#remain').textContent = '타이머 없음';
    }
  }

  // Called from a tap: unlock both audio elements inside the gesture, then swap in the rendered loops.
  async function start() {
    if (state.playing) return;
    state.playing = true;
    startAt = Date.now();
    endAt = state.timer ? startAt + state.timer * 60000 : 0;
    try { musicEl.volume = 0; ambEl.volume = 0; } catch (e) {}
    [musicEl, ambEl].forEach((el) => { if (!el.src) el.src = SILENT; el.play().catch(() => {}); });
    showNight();
    try {
      const [mu, au] = await prepare();
      if (!state.playing) return;
      await Promise.all([setAndPlay(musicEl, mu), setAndPlay(ambEl, au)]);
    } catch (e) {
      stop('소리를 켜지 못했어요. 달을 한 번 더 눌러주세요.');
    }
  }
  // Called on page open: browsers often block sound until a tap, so this only succeeds sometimes.
  async function tryAutostart() {
    try {
      const [mu, au] = await prepare();
      if (state.playing || (!mu && !au)) return;
      startAt = Date.now();
      endAt = state.timer ? startAt + state.timer * 60000 : 0;
      try { musicEl.volume = 0; ambEl.volume = 0; } catch (e) {}
      await Promise.all([setAndPlay(musicEl, mu), setAndPlay(ambEl, au)]);
      state.playing = true;
      showNight();
    } catch (e) {
      musicEl.pause(); ambEl.pause();
      $('#hint').textContent = '달을 한 번 눌러주세요. 브라우저가 자동 재생을 막았어요.';
    }
  }
  function stop(message) {
    state.playing = false;
    musicEl.pause(); ambEl.pause();
    clearInterval(tickId); clearTimeout(breathId); clearInterval(whisperId); clearTimeout(dimId);
    $('#night').hidden = true; $('#home').hidden = false;
    $('#hint').textContent = message || '달을 누르면 자장가가 시작돼요';
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  }

  /* ---------- night screen ---------- */
  const PHASES = [['숨을 들이쉬어요', 4, 1.3], ['잠시 멈춰요', 7, 1.3], ['천천히 내쉬어요', 8, 1]];
  const WHISPERS = [
    '휴대폰을 내려놓고 눈을 감아요',
    '오늘 못 한 일은 내일의 나에게 맡겨요',
    '어깨와 턱의 힘을 스르르 풀어요',
    '지금은 아무것도 하지 않아도 괜찮아요',
    '이불의 무게와 따뜻함을 느껴봐요',
    '숨이 들어오고 나가는 것만 바라봐요',
  ];
  function breathe(i, left) {
    if (!state.playing) return;
    const [txt, sec, scale] = PHASES[i];
    if (left === sec) {
      const orb = $('#orb');
      orb.style.transitionDuration = sec + 's';
      orb.style.transform = `scale(${scale})`;
      $('#breathText').textContent = txt;
    }
    $('#breathCount').textContent = left;
    breathId = setTimeout(() => (left > 1 ? breathe(i, left - 1) : breathe((i + 1) % 3, PHASES[(i + 1) % 3][1])), 1000);
  }
  function scheduleDim() {
    $('#night').classList.remove('dim');
    clearTimeout(dimId);
    dimId = setTimeout(() => $('#night').classList.add('dim'), 20000);
  }
  function showNight() {
    $('#home').hidden = true; $('#night').hidden = false;
    let w = 0; const el = $('#whisper'); el.textContent = WHISPERS[0]; el.style.opacity = 1;
    clearInterval(whisperId);
    whisperId = setInterval(() => {
      el.style.opacity = 0;
      setTimeout(() => { w = (w + 1) % WHISPERS.length; el.textContent = WHISPERS[w]; el.style.opacity = 1; }, 1500);
    }, 24000);
    clearTimeout(breathId); breathe(0, PHASES[0][1]);
    clearInterval(tickId); tick(); tickId = setInterval(tick, 500);
    scheduleDim();
    if ('mediaSession' in navigator) {
      try {
        const parts = [state.music !== 'none' && TRACKS[state.music].title, state.amb !== 'none' && AMB_TITLES[state.amb]].filter(Boolean);
        navigator.mediaSession.metadata = new MediaMetadata({ title: parts.join(' + ') || '달빛 자장가', artist: '달빛 자장가' });
        navigator.mediaSession.playbackState = 'playing';
        navigator.mediaSession.setActionHandler('pause', () => stop());
        navigator.mediaSession.setActionHandler('stop', () => stop());
      } catch (e) {}
    }
  }
  (function makeStars() {
    const box = $('#stars'); const rnd = mulberry(42);
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('span'); s.className = 'star';
      s.style.left = (rnd() * 100) + '%'; s.style.top = (rnd() * 100) + '%';
      s.style.animationDelay = (-rnd() * 7) + 's'; s.style.animationDuration = (5 + rnd() * 6) + 's';
      if (rnd() < 0.2) { s.style.width = s.style.height = '3px'; }
      box.appendChild(s);
    }
  })();

  /* ---------- controls ---------- */
  document.querySelectorAll('.chips').forEach((group) => {
    const key = group.dataset.group;
    const sync = () => group.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.value === String(state[key]))));
    group.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip'); if (!chip) return;
      state[key] = key === 'timer' ? +chip.dataset.value : chip.dataset.value;
      store.set(key, state[key]); sync();
      if (key !== 'timer') prepare().catch(() => {});
    });
    sync();
  });
  [['musicVol', '#musicVol'], ['ambVol', '#ambVol']].forEach(([key, sel]) => {
    const el = $(sel); el.value = state[key];
    el.addEventListener('input', () => { state[key] = +el.value; store.set(key, state[key]); });
  });
  const auto = $('#autostart'); auto.checked = state.autostart;
  auto.addEventListener('change', () => { state.autostart = auto.checked; store.set('autostart', auto.checked); });

  $('#moon').addEventListener('click', start);
  $('#stop').addEventListener('click', () => stop());
  $('#night').addEventListener('pointerdown', scheduleDim);

  // Render the chosen sounds right away so the first tap starts instantly.
  const moon = $('#moon');
  moon.classList.add('loading');
  prepare().catch(() => {}).finally(() => moon.classList.remove('loading'));
  if (state.autostart) tryAutostart();

  /*PWA*/ if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(() => {}); } /*/PWA*/
})();
</script>
</body>
</html>
